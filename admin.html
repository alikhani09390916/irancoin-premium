<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | IRAN COIN</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-size='28' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EIC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --grad-brand: linear-gradient(135deg, #7C3AED 0%, #06B6D4 100%);
      --bg-main: #0a0e1a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --border-active: rgba(124,58,237,0.4);
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --success: #10b981;
      --warning: #fbbf24;
      --danger: #ef4444;
      --info: #3b82f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
    }
    .admin-login {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .login-card {
      background: linear-gradient(160deg, #1a1040, #0f172a);
      border: 1px solid var(--border-active);
      border-radius: 1.25rem; padding: 2.5rem;
      max-width: 24rem; width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-card h1 {
      font-size: 1.5rem; margin-bottom: 0.5rem;
      background: var(--grad-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-card p { color: var(--text-dim); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .login-card input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem;
      border: 1px solid var(--border); background: rgba(255,255,255,0.06);
      color: var(--text); font-size: 1rem; font-family: inherit;
      outline: none; margin-bottom: 1rem; direction: ltr; text-align: center;
    }
    .login-card input:focus { border-color: var(--border-active); }
    .login-card button {
      width: 100%; padding: 0.75rem; border-radius: 0.75rem;
      background: var(--grad-brand); border: none; color: white;
      font-weight: 600; font-size: 1rem; cursor: pointer; font-family: inherit;
    }
    .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: var(--danger); font-size: 0.8125rem; margin-top: 0.5rem; }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard.active { display: block; }
    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,0.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .dash-header h1 {
      font-size: 1.25rem;
      background: var(--grad-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .dash-header button {
      padding: 0.5rem 1.25rem; border-radius: 0.5rem;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: var(--danger); cursor: pointer; font-family: inherit; font-size: 0.875rem;
    }
    .dash-nav {
      display: flex; gap: 0.5rem; padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .dash-nav button {
      padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim); cursor: pointer;
      font-family: inherit; font-size: 0.875rem; white-space: nowrap;
      transition: all 0.2s;
    }
    .dash-nav button:hover { background: var(--bg-card-hover); color: var(--text); }
    .dash-nav button.active {
      background: rgba(124,58,237,0.15); border-color: var(--border-active);
      color: #a78bfa; font-weight: 600;
    }
    .dash-content { padding: 2rem; max-width: 80rem; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 1rem; margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 1rem; padding: 1.25rem;
      transition: all 0.3s;
    }
    .stat-card:hover { border-color: var(--border-active); transform: translateY(-2px); }
    .stat-card .label { color: var(--text-dim); font-size: 0.8125rem; margin-bottom: 0.5rem; }
    .stat-card .value {
      font-size: 1.75rem; font-weight: 800;
      background: var(--grad-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-card .sub { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.25rem; }

    /* Tables */
    .table-wrap {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 1rem; overflow: hidden;
    }
    .table-wrap h2 {
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      font-size: 1rem; font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 0.75rem 1rem; text-align: right; font-size: 0.8125rem;
      color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    td {
      padding: 0.75rem 1rem; font-size: 0.875rem; border-bottom: 1px solid var(--border);
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge {
      display: inline-block; padding: 0.2rem 0.625rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-success { background: rgba(16,185,129,0.15); color: var(--success); }
    .badge-warning { background: rgba(251,191,36,0.15); color: var(--warning); }
    .badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge-info { background: rgba(59,130,246,0.15); color: var(--info); }
    .badge-neutral { background: rgba(148,163,184,0.15); color: var(--text-dim); }

    .section { display: none; }
    .section.active { display: block; }

    @media (max-width: 640px) {
      .dash-content { padding: 1rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      table { font-size: 0.8125rem; }
      th, td { padding: 0.5rem 0.625rem; }
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="admin-login" id="login-view">
    <div class="login-card">
      <h1>پنل مدیریت IRAN COIN</h1>
      <p>کلید ادمین را وارد کنید</p>
      <input type="password" id="admin-key" placeholder="Admin Key" autofocus>
      <button onclick="doLogin()">ورود</button>
      <p class="error-msg" id="login-error" style="display:none"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dash-view">
    <div class="dash-header">
      <h1>پنل مدیریت IRAN COIN</h1>
      <button onclick="doLogout()">خروج</button>
    </div>
    <div class="dash-nav">
      <button class="active" data-section="overview">آمار کلی</button>
      <button data-section="payments">پرداخت‌ها</button>
      <button data-section="subscriptions">اشتراک‌ها</button>
      <button data-section="users">کاربران</button>
      <button data-section="emails">ایمیل‌ها</button>
    </div>
    <div class="dash-content">
      <!-- Overview -->
      <div class="section active" id="sec-overview">
        <div class="stats-grid" id="stats-grid"></div>
      </div>

      <!-- Payments -->
      <div class="section" id="sec-payments">
        <div class="table-wrap">
          <h2>لیست پرداخت‌ها</h2>
          <div style="overflow-x:auto"><table id="tbl-payments"><thead><tr>
            <th>تاریخ</th><th>کاربر</th><th>پلن</th><th>مبلغ</th><th>وضعیت</th><th>TX Hash</th>
          </tr></thead><tbody></tbody></table></div>
        </div>
      </div>

      <!-- Subscriptions -->
      <div class="section" id="sec-subscriptions">
        <div class="table-wrap">
          <h2>لیست اشتراک‌ها</h2>
          <div style="overflow-x:auto"><table id="tbl-subs"><thead><tr>
            <th>تاریخ</th><th>کاربر</th><th>پلن</th><th>وضعیت</th><th>شروع</th><th>انقضا</th>
          </tr></thead><tbody></tbody></table></div>
        </div>
      </div>

      <!-- Users -->
      <div class="section" id="sec-users">
        <div class="table-wrap">
          <h2>لیست کاربران</h2>
          <div style="overflow-x:auto"><table id="tbl-users"><thead><tr>
            <th>تاریخ عضویت</th><th>ایمیل</th><th>نام</th><th>آخرین ورود</th>
          </tr></thead><tbody></tbody></table></div>
        </div>
      </div>

      <!-- Emails -->
      <div class="section" id="sec-emails">
        <div class="table-wrap">
          <h2>لاگ ایمیل‌ها</h2>
          <div style="overflow-x:auto"><table id="tbl-emails"><thead><tr>
            <th>تاریخ</th><th>گیرنده</th><th>قالب</th><th>موضوع</th><th>وضعیت</th>
          </tr></thead><tbody></tbody></table></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var ADMIN_KEY = '';
    var API_BASE = 'https://ibnpgzmbepieudwalwtv.supabase.co/functions/v1';

    function doLogin() {
      ADMIN_KEY = document.getElementById('admin-key').value.trim();
      if (!ADMIN_KEY) return;
      loadSection('overview');
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dash-view').classList.add('active');
    }

    document.getElementById('admin-key').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    function doLogout() {
      ADMIN_KEY = '';
      document.getElementById('dash-view').classList.remove('active');
      document.getElementById('login-view').style.display = '';
      document.getElementById('admin-key').value = '';
    }

    document.querySelectorAll('.dash-nav button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.dash-nav button').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById('sec-' + btn.dataset.section).classList.add('active');
        loadSection(btn.dataset.section);
      });
    });

    async function loadSection(section) {
      try {
        var res = await fetch(API_BASE + '/admin-stats?section=' + section, {
          headers: { 'X-Admin-Key': ADMIN_KEY }
        });
        var data = await res.json();
        if (res.status === 401) {
          alert('کلید ادمین نامعتبر است');
          doLogout();
          return;
        }
        renderSection(section, data);
      } catch (e) {
        console.error('Load error:', e);
      }
    }

    function renderSection(section, data) {
      if (section === 'overview') {
        var grid = document.getElementById('stats-grid');
        grid.innerHTML = [
          { label: 'کل کاربران', value: data.total_users, sub: 'عضو ثبت‌نام‌شده' },
          { label: 'اشتراک فعال', value: data.active_subscriptions, sub: 'در حال حاضر فعال' },
          { label: 'پرداخت تایید شده', value: data.confirmed_payments, sub: 'تراکنش موفق' },
          { label: 'درآمد کل', value: '$' + (data.total_revenue_usdt || 0).toLocaleString(), sub: 'USDT' },
          { label: 'پرداخت در انتظار', value: data.pending_subscriptions, sub: 'منتظر تایید' },
          { label: 'ایمیل ارسال شده', value: data.emails_sent, sub: '总数' },
        ].map(function(s) {
          return '<div class="stat-card"><div class="label">' + s.label + '</div><div class="value">' + s.value + '</div><div class="sub">' + s.sub + '</div></div>';
        }).join('');
      }

      if (section === 'payments') {
        var tbody = document.querySelector('#tbl-payments tbody');
        tbody.innerHTML = (data.payments || []).map(function(p) {
          var statusClass = {
            confirmed: 'badge-success', waiting: 'badge-warning',
            confirming: 'badge-info', failed: 'badge-danger',
            refunded: 'badge-danger', expired: 'badge-neutral'
          }[p.payment_status] || 'badge-neutral';
          var statusText = {
            confirmed: 'تایید شده', waiting: 'در انتظار',
            confirming: 'در حال تایید', failed: 'ناموفق',
            refunded: 'بازگشت', expired: 'منقضی'
          }[p.payment_status] || p.payment_status;
          return '<tr><td>' + new Date(p.created_at).toLocaleDateString('fa-IR') + '</td><td>' + (p.profiles?.full_name || p.user_id?.slice(0,8) || '-') + '</td><td>' + (p.subscriptions?.plans?.label || p.plan_id) + '</td><td>$' + p.amount_usdt + '</td><td><span class="badge ' + statusClass + '">' + statusText + '</span></td><td style="font-size:0.75rem;direction:ltr;text-align:left">' + (p.tx_hash || '-') + '</td></tr>';
        }).join('');
      }

      if (section === 'subscriptions') {
        var tbody = document.querySelector('#tbl-subs tbody');
        tbody.innerHTML = (data.subscriptions || []).map(function(s) {
          var statusClass = {
            active: 'badge-success', pending: 'badge-warning',
            expired: 'badge-danger', cancelled: 'badge-neutral'
          }[s.status] || 'badge-neutral';
          var statusText = {
            active: 'فعال', pending: 'در انتظار',
            expired: 'منقضی', cancelled: 'لغو شده'
          }[s.status] || s.status;
          return '<tr><td>' + new Date(s.created_at).toLocaleDateString('fa-IR') + '</td><td>' + (s.profiles?.full_name || s.user_id?.slice(0,8) || '-') + '</td><td>' + (s.plans?.label || s.plan_id) + '</td><td><span class="badge ' + statusClass + '">' + statusText + '</span></td><td>' + (s.started_at ? new Date(s.started_at).toLocaleDateString('fa-IR') : '-') + '</td><td>' + (s.expires_at ? new Date(s.expires_at).toLocaleDateString('fa-IR') : '-') + '</td></tr>';
        }).join('');
      }

      if (section === 'users') {
        var tbody = document.querySelector('#tbl-users tbody');
        tbody.innerHTML = (data.users || []).map(function(u) {
          return '<tr><td>' + new Date(u.created_at).toLocaleDateString('fa-IR') + '</td><td style="direction:ltr;text-align:left">' + u.email + '</td><td>' + (u.name || '-') + '</td><td>' + (u.last_sign_in ? new Date(u.last_sign_in).toLocaleDateString('fa-IR') : 'هرگز') + '</td></tr>';
        }).join('');
      }

      if (section === 'emails') {
        var tbody = document.querySelector('#tbl-emails tbody');
        tbody.innerHTML = (data.emails || []).map(function(e) {
          var statusClass = { sent: 'badge-success', failed: 'badge-danger', bounced: 'badge-danger' }[e.status] || 'badge-neutral';
          var templateNames = { welcome: 'خوش‌آمد', payment_success: 'پرداخت موفق', subscription_expiring: 'رو به انقضا', subscription_expired: 'منقضی شده', payment_failed: 'پرداخت ناموفق' };
          return '<tr><td>' + new Date(e.created_at).toLocaleDateString('fa-IR') + '</td><td style="direction:ltr;text-align:left">' + e.to_email + '</td><td>' + (templateNames[e.template] || e.template) + '</td><td>' + e.subject + '</td><td><span class="badge ' + statusClass + '">' + e.status + '</span></td></tr>';
        }).join('');
      }
    }
  </script>
</body>
</html>
