name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: Which page has the bug?
      placeholder: "index.html, dashboard.html, pricing.html, admin.html"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (site broken)
        - High (major feature broken)
        - Medium (minor issue)
        - Low (cosmetic)
    validations:
      required: true
